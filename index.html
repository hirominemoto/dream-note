<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#1c1d34;color:#ebe7f6}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>夢のノート</title>
<style>
/* Layout: one quiet column of soft glass slips, like pages of a notebook kept by the bedside.
   Palette: midnight indigo with moonlit rose. 端末の明るさ設定にかかわらず、いつも夜の色で表示する。 */
:root {
  color-scheme: dark;
  --bg: #1c1d34;
  --ink: #ebe7f6;
  --muted: #a19cc0;
  --accent: #c7a6e8;
  --accent-ink: #1c1d34;
  --glow: #f1d88f;
  --alert: #f0a2b8;
  --haze: rgba(120, 96, 170, 0.34);
  --haze-2: rgba(214, 170, 110, 0.16);
  --card: rgba(255, 255, 255, 0.055);
  --field: rgba(255, 255, 255, 0.07);
  --line: rgba(255, 255, 255, 0.11);
  --shadow: 0 18px 40px -26px rgba(0, 0, 0, 0.6);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1c1d34;
    --ink: #ebe7f6;
    --muted: #a19cc0;
    --accent: #c7a6e8;
    --accent-ink: #1c1d34;
    --glow: #f1d88f;
    --alert: #f0a2b8;
    --haze: rgba(120, 96, 170, 0.34);
    --haze-2: rgba(214, 170, 110, 0.16);
    --card: rgba(255, 255, 255, 0.055);
    --field: rgba(255, 255, 255, 0.07);
    --line: rgba(255, 255, 255, 0.11);
    --shadow: 0 18px 40px -26px rgba(0, 0, 0, 0.6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1c1d34;
  --ink: #ebe7f6;
  --muted: #a19cc0;
  --accent: #c7a6e8;
  --accent-ink: #1c1d34;
  --glow: #f1d88f;
  --alert: #f0a2b8;
  --haze: rgba(120, 96, 170, 0.34);
  --haze-2: rgba(214, 170, 110, 0.16);
  --card: rgba(255, 255, 255, 0.055);
  --field: rgba(255, 255, 255, 0.07);
  --line: rgba(255, 255, 255, 0.11);
  --shadow: 0 18px 40px -26px rgba(0, 0, 0, 0.6);
}

body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: Meiryo, "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif;
  font-size: 15px;
  line-height: 1.85;
}
/* Soft haze behind everything, and a few faint stars. */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  background:
    radial-gradient(60% 45% at 12% 0%, var(--haze), transparent 70%),
    radial-gradient(50% 40% at 100% 22%, var(--haze-2), transparent 70%);
}
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: 0.55;
  background-image:
    radial-gradient(1.5px 1.5px at 8% 18%, var(--glow), transparent),
    radial-gradient(1px 1px at 27% 62%, var(--ink), transparent),
    radial-gradient(1.5px 1.5px at 61% 9%, var(--glow), transparent),
    radial-gradient(1px 1px at 84% 44%, var(--ink), transparent),
    radial-gradient(1px 1px at 46% 86%, var(--glow), transparent),
    radial-gradient(1px 1px at 93% 88%, var(--ink), transparent);
}

*, *::before, *::after { box-sizing: border-box; }

.wrap {
  max-width: 680px;
  margin: 0 auto;
  padding-block: 44px 96px;
  padding-inline: 18px;
}

/* Header */
.top {
  text-align: center;
  margin-bottom: 30px;
}
.moon {
  width: 46px;
  height: 46px;
  margin: 0 auto 14px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #fffaf0, var(--glow) 70%);
  box-shadow: 0 0 28px 4px color-mix(in srgb, var(--glow) 35%, transparent);
}
.sky {
  position: relative;
  width: min(240px, 100%);
  height: 130px;
  margin: 0 auto 10px;
}
.sky .moon {
  position: absolute;
  left: 50%;
  top: 50%;
  margin: 0;
  transform: translate(-50%, -50%);
}
.star {
  position: absolute;
  background: var(--glow);
  clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
  filter: drop-shadow(0 0 3px var(--glow));
  opacity: 0.4;
  animation: twinkle 2.8s ease-in-out infinite;
}
.star:nth-child(2n) { animation-delay: -1.2s; }
.star:nth-child(3n) { animation-delay: -2.1s; }
.star:nth-child(5n) { animation-delay: -0.6s; }
@keyframes twinkle {
  0%, 100% { opacity: 0.35; transform: scale(0.8) rotate(0deg); }
  50% { opacity: 1; transform: scale(1.1) rotate(18deg); }
}
@media (prefers-reduced-motion: reduce) {
  .star { animation: none; opacity: 0.8; }
}

.kicker {
  margin: 0;
  font-size: 12px;
  letter-spacing: 0.22em;
  color: var(--accent);
}
h1 {
  margin: 4px 0 6px;
  font-size: 30px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-wrap: balance;
}
.lede {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
  text-wrap: balance;
}

/* Surfaces */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 22px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
h2 {
  margin: 0 0 14px;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 0.04em;
}

/* Form */
form { display: grid; gap: 16px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > span {
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 0.04em;
}
.row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
}
.row > * { min-width: 0; }
input[type="text"],
input[type="date"],
input[type="search"],
textarea {
  width: 100%;
  font: inherit;
  font-size: 15px;
  color: var(--ink);
  background: var(--field);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 13px;
  transition: border-color 0.2s ease, background 0.2s ease;
}
textarea {
  resize: vertical;
  min-height: 140px;
  line-height: 1.85;
}
input::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.75; }
input:focus, textarea:focus { outline: none; border-color: var(--accent); }
input:focus-visible, textarea:focus-visible, button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Feeling chips */
.tags {
  border: 0;
  padding: 0;
  margin: 0;
  min-width: 0;
}
.tags legend {
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 0.04em;
  padding: 0;
  margin-bottom: 8px;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.chip { position: relative; cursor: pointer; }
.chip input {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
  pointer-events: none;
}
.chip span {
  display: inline-block;
  padding: 5px 14px;
  font-size: 13px;
  color: var(--muted);
  background: var(--field);
  border: 1px solid var(--line);
  border-radius: 999px;
  transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
}
.chip:hover span { border-color: var(--accent); }
.chip input:checked + span {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: transparent;
}
.chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.error {
  margin: 0;
  font-size: 14px;
  color: var(--alert);
}
.error[hidden] { display: none; }

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: flex-end;
}
button {
  font: inherit;
  font-size: 14px;
  cursor: pointer;
  border-radius: 999px;
  padding: 9px 20px;
  transition: filter 0.2s ease, background 0.2s ease, color 0.2s ease;
}
.primary {
  background: var(--accent);
  color: var(--accent-ink);
  border: 0;
  font-weight: 700;
  padding: 10px 26px;
}
.primary:hover { filter: brightness(1.06); }
.ghost {
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--line);
}
.ghost:hover { color: var(--ink); border-color: var(--accent); }

/* List head */
.list-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 44px 4px 16px;
}
.list-head h2 { margin: 0; }
.count {
  font-weight: 400;
  font-size: 13px;
  color: var(--muted);
  margin-left: 4px;
}
#search {
  width: min(100%, 240px);
  font-size: 14px;
  padding: 8px 14px;
}

/* Export and search controls */
.list-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.list-tools #search { flex: 1 1 170px; }

/* Entries */
.entries {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 14px;
}
.entry {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 18px 20px 14px;
  min-width: 0;
}
.entry-head { display: grid; gap: 2px; min-width: 0; }
.date {
  margin: 0;
  font-size: 12px;
  letter-spacing: 0.06em;
  color: var(--muted);
}
.title {
  margin: 0;
  font-size: 16px;
  font-weight: 700;
  overflow-wrap: anywhere;
}
.body {
  margin: 10px 0 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.people {
  margin: 10px 0 0;
  font-size: 13px;
  color: var(--muted);
  overflow-wrap: anywhere;
}
.pills {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}
.pill {
  font-size: 12px;
  color: var(--accent);
  border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
  border-radius: 999px;
  padding: 1px 10px;
}
.entry-foot {
  display: flex;
  justify-content: flex-end;
  gap: 4px;
  margin-top: 8px;
}
.entry-foot button {
  background: transparent;
  color: var(--muted);
  border: 0;
  padding: 4px 8px;
  font-size: 13px;
}
.edit:hover { color: var(--accent); }
.del:hover, .del[data-armed] { color: var(--alert); }
.entry.editing {
  border-color: color-mix(in srgb, var(--accent) 45%, transparent);
  padding-bottom: 18px;
}

/* AI summary */
.summary { margin-bottom: 16px; }
.summary-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}
.summary-head h2 { margin: 0; }
.summary-close {
  background: transparent;
  color: var(--muted);
  border: 0;
  padding: 4px 8px;
  font-size: 13px;
}
.summary-close:hover { color: var(--ink); }
.summary-status {
  margin: 10px 0 0;
  font-size: 13px;
  color: var(--muted);
}
.summary-status[data-state="busy"] { color: var(--accent); }
.summary-status[data-state="err"] { color: var(--alert); }
.summary-meta {
  margin: 8px 0 0;
  font-size: 12px;
  letter-spacing: 0.04em;
  color: var(--muted);
}
.summary h3 {
  margin: 24px 0 10px;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.04em;
}
.summary .nothing { margin: 0; font-size: 14px; color: var(--muted); }
.tally {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}
.tally span {
  font-size: 13px;
  color: var(--muted);
  background: var(--field);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 6px 12px;
}
.tally b {
  margin-left: 6px;
  font-size: 18px;
  color: var(--ink);
}
.facts, .evidence {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
}
.facts { gap: 10px; }
.facts > li {
  background: var(--field);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 14px;
  min-width: 0;
  overflow-wrap: anywhere;
}
.fact-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 10px;
}
.fact-label { font-weight: 700; }
.summary h3 .fact-count { margin-left: 8px; font-weight: 400; letter-spacing: 0; }
.facts details > summary { cursor: pointer; list-style: none; }
.facts details > summary::-webkit-details-marker { display: none; }
.facts details > summary::after { content: '▸'; margin-left: auto; color: var(--muted); font-size: 12px; }
.facts details[open] > summary::after { content: '▾'; }
.fact-count { font-size: 13px; color: var(--muted); }
.fact-dream {
  font-size: 12px;
  letter-spacing: 0.04em;
  color: var(--muted);
}
.fact-text { margin: 6px 0 0; font-size: 14px; white-space: pre-line; }
.quote { margin: 2px 0 0; font-size: 14px; }
.evidence { gap: 8px; margin-top: 8px; }
.pill.res-ok { color: var(--glow); border-color: color-mix(in srgb, var(--glow) 45%, transparent); }
.pill.res-ng { color: var(--alert); border-color: color-mix(in srgb, var(--alert) 45%, transparent); }
.pill.res-unknown { color: var(--muted); border-color: var(--line); }
.summary-note {
  margin: 20px 0 0;
  font-size: 12px;
  color: var(--muted);
}

.empty {
  text-align: center;
  color: var(--muted);
  padding: 36px 16px;
  border: 1px dashed var(--line);
  border-radius: 18px;
  margin: 0;
  text-wrap: balance;
}
.empty[hidden] { display: none; }

/* Sync */
.sync-status {
  margin: 12px 0 0;
  font-size: 12px;
  letter-spacing: 0.04em;
  color: var(--muted);
}
.sync-status::before {
  content: "";
  display: inline-block;
  width: 7px;
  height: 7px;
  margin-right: 7px;
  border-radius: 50%;
  vertical-align: 1px;
  background: var(--muted);
  opacity: 0.6;
}
.sync-status[data-state="ok"]::before { background: var(--glow); opacity: 1; box-shadow: 0 0 6px var(--glow); }
.sync-status[data-state="busy"]::before { background: var(--accent); opacity: 1; }
.sync-status[data-state="err"] { color: var(--alert); }
.sync-status[data-state="err"]::before { background: var(--alert); opacity: 1; }

.sync-box {
  margin-top: 44px;
  font-size: 13px;
  color: var(--muted);
}
.sync-box summary {
  cursor: pointer;
  width: fit-content;
  margin: 0 auto;
  letter-spacing: 0.04em;
}
.sync-box summary:hover { color: var(--ink); }
.sync-box .card { margin-top: 14px; }
.sync-box p { margin: 0 0 12px; }
.sync-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.sync-row input { flex: 1 1 180px; min-width: 0; }
.sync-row input[type="text"] {
  font: inherit;
  font-size: 15px;
  color: var(--ink);
  background: var(--field);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 9px 13px;
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>

<main class="wrap">
  <header class="top">
    <div class="sky" aria-hidden="true">
      <div class="moon"></div>
      <span class="star" style="left:4%;top:22%;width:8px;height:8px"></span>
      <span class="star" style="left:14%;top:72%;width:5px;height:5px"></span>
      <span class="star" style="left:26%;top:6%;width:6px;height:6px"></span>
      <span class="star" style="left:72%;top:4%;width:5px;height:5px"></span>
      <span class="star" style="left:86%;top:34%;width:9px;height:9px"></span>
      <span class="star" style="left:92%;top:78%;width:5px;height:5px"></span>
      <span class="star" style="left:60%;top:86%;width:7px;height:7px"></span>
      <span class="star" style="left:38%;top:92%;width:4px;height:4px"></span>
    </div>
    <p class="kicker">DREAM LOG</p>
    <h1>夢のノート</h1>
    <p class="lede">目が覚めて残っている断片を、そのまま置いておく場所。</p>
    <p class="sync-status" id="sync-status" role="status"></p>
  </header>

  <section class="card" aria-labelledby="compose-title">
    <h2 id="compose-title">いまの夢を書く</h2>
    <form id="form" novalidate>
      <div class="row">
        <label class="field">
          <span>見た日</span>
          <input type="date" id="f-date" required>
        </label>
        <label class="field">
          <span>タイトル（なくてもいい）</span>
          <input type="text" id="f-title" maxlength="60" placeholder="例：白い傘の駅">
        </label>
      </div>

      <label class="field">
        <span>夢の内容</span>
        <textarea id="f-body" placeholder="場面、色、におい。順番がばらばらでもいいよ。"></textarea>
      </label>

      <label class="field">
        <span>出てきた人</span>
        <input type="text" id="f-people" placeholder="名前でも、雰囲気でもいい">
      </label>

      <fieldset class="tags">
        <legend>目が覚めたときに残っている感じ</legend>
        <div class="chips">
          <label class="chip"><input type="checkbox" value="鮮明"><span>鮮明</span></label>
          <label class="chip"><input type="checkbox" value="ぼんやり"><span>ぼんやり</span></label>
          <label class="chip"><input type="checkbox" value="こわい"><span>こわい</span></label>
          <label class="chip"><input type="checkbox" value="なつかしい"><span>なつかしい</span></label>
          <label class="chip"><input type="checkbox" value="うれしい"><span>うれしい</span></label>
          <label class="chip"><input type="checkbox" value="不思議"><span>不思議</span></label>
        </div>
      </fieldset>

      <p class="error" id="f-error" role="alert" hidden></p>

      <div class="actions">
        <button type="button" id="f-clear" class="ghost">クリア</button>
        <button type="submit" class="primary">書き留める</button>
      </div>
    </form>
  </section>

  <div class="list-head">
    <h2>これまでの夢 <span class="count" id="count"></span></h2>
    <div class="list-tools"><button type="button" id="ai-summary" class="ghost">AIで整理する</button>
    <button type="button" id="export-md" class="ghost">Markdownで書き出す</button>
    <input type="search" id="search" placeholder="言葉で探す" aria-label="夢を探す"></div>
  </div>

  <!-- これまでの夢をAIに読ませて、繰り返し出てくるものや行動の結果を数えた結果 -->
  <section class="card summary" id="summary" aria-labelledby="summary-title" hidden>
    <div class="summary-head">
      <h2 id="summary-title">記録から整理したこと</h2>
      <button type="button" class="summary-close" id="summary-close">閉じる</button>
    </div>
    <p class="summary-status" id="summary-status" role="status"></p>
    <div id="summary-body"></div>
  </section>

  <ul class="entries" id="list"></ul>
  <p class="empty" id="empty" hidden></p>

  <!-- 書いた夢を、その場で書き直すための欄。感じのチップは「いまの夢を書く」から写して入れる -->
  <template id="edit-tpl">
    <form class="edit-form" novalidate aria-label="夢を書き直す">
      <div class="row">
        <label class="field">
          <span>見た日</span>
          <input type="date" name="date" required>
        </label>
        <label class="field">
          <span>タイトル（なくてもいい）</span>
          <input type="text" name="title" maxlength="60">
        </label>
      </div>
      <label class="field">
        <span>夢の内容</span>
        <textarea name="body"></textarea>
      </label>
      <label class="field">
        <span>出てきた人</span>
        <input type="text" name="people">
      </label>
      <p class="error" role="alert" hidden></p>
      <div class="actions">
        <button type="button" class="ghost" data-act="cancel">やめる</button>
        <button type="submit" class="primary">書き直す</button>
      </div>
    </form>
  </template>

  <details class="sync-box" id="sync-box">
    <summary>同期の設定</summary>
    <div class="card">
      <p>PCとスマホで同じノートを見るための「あいことば」。どの端末でも同じものを入れてね。</p>
      <form class="sync-row" id="sync-form">
        <input type="text" id="sync-key" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="あいことば（ひらがなでもOK）" aria-label="あいことば">
        <button type="submit" class="primary">つなぐ</button>
      </form>
    </div>
  </details>
</main>

<script>
(function () {
  var KEY = 'dream-journal-v1';
  var DEL_KEY = 'dream-pending-delete-v1';
  var SYNC_KEY = 'dream-sync-key-v1';
  // 保管庫の場所。Netlifyで開いたときは同じ場所にあるので空でOK。
  // GitHub Pagesで開いたときは、ここに書いたNetlifyのアドレスへ見に行く（例：'https://xxxx.netlify.app'）。
  var NETLIFY_URL = 'https://cheery-yeot-d31a3a.netlify.app';
  var ON_PAGES = /\.github\.io$/.test(location.hostname);
  var API_BASE = ON_PAGES ? NETLIFY_URL : '';
  var CAN_SYNC = !ON_PAGES || !!NETLIFY_URL;
  var dreams = load();
  var pendingDel = loadList(DEL_KEY);
  var syncKey = loadText(SYNC_KEY);
  var syncing = false;
  var again = false;
  var editors = {}; // 書き直している途中の欄（夢の id → 欄）
  var $ = function (s) { return document.querySelector(s); };

  // 夢がいつの版かを表す。書き直していない夢は updated を持たないので、書いた時刻で比べる
  function stamp(d) { return Number(d.updated || d.created) || 0; }

  function find(id) {
    for (var i = 0; i < dreams.length; i++) if (dreams[i].id === id) return i;
    return -1;
  }

  function load() {
    try {
      var v = JSON.parse(localStorage.getItem(KEY));
      return Array.isArray(v) ? v : [];
    } catch (e) {
      return [];
    }
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(dreams));
      localStorage.setItem(DEL_KEY, JSON.stringify(pendingDel));
      return true;
    } catch (e) {
      return false;
    }
  }

  function loadList(k) {
    try {
      var v = JSON.parse(localStorage.getItem(k));
      return Array.isArray(v) ? v : [];
    } catch (e) {
      return [];
    }
  }

  function loadText(k) {
    try { return localStorage.getItem(k) || ''; } catch (e) { return ''; }
  }

  function hhmm() {
    var d = new Date();
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function setStatus(state, text) {
    var el = $('#sync-status');
    el.setAttribute('data-state', state);
    el.textContent = text;
  }

  // 手元のノートと保管庫を突き合わせる。
  // 手元にしかない夢は送り、消した夢は「消した」と伝え、返ってきた全体を手元に写す。
  function sync() {
    if (!CAN_SYNC) {
      setStatus('off', 'この端末だけに保存しています');
      return;
    }
    if (!syncKey) {
      setStatus('off', 'この端末だけに保存しています（下の「同期の設定」でつなげられます）');
      return;
    }
    if (syncing) { again = true; return; }
    syncing = true;
    setStatus('busy', '同期しています…');
    fetch(API_BASE + '/api/dreams', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-dream-key': encodeURIComponent(syncKey) },
      body: JSON.stringify({ upsert: dreams, delete: pendingDel })
    })
      .then(function (r) {
        if (r.status === 401) throw new Error('key');
        if (!r.ok) throw new Error('server');
        return r.json();
      })
      .then(function (data) {
        var sentDel = pendingDel.slice();
        // 送っている間に増えた夢・消した夢は手元に残しておき、次の同期で送る
        var serverIds = {};
        data.dreams.forEach(function (d) { serverIds[d.id] = true; });
        var gone = {};
        data.deleted.forEach(function (id) { gone[id] = true; });
        var localOnly = dreams.filter(function (d) { return !serverIds[d.id] && !gone[d.id]; });
        // 送っている間に手元で書き直した夢は、手元の版を残しておき、次の同期で送る
        var mine = {};
        dreams.forEach(function (d) { mine[d.id] = d; });
        var newer = false;
        var fromServer = data.dreams.map(function (d) {
          var m = mine[d.id];
          if (m && stamp(m) > stamp(d)) { newer = true; return m; }
          return d;
        });
        pendingDel = pendingDel.filter(function (id) { return sentDel.indexOf(id) === -1; });
        dreams = fromServer.concat(localOnly).filter(function (d) { return pendingDel.indexOf(d.id) === -1; });
        save();
        render();
        var gh = data.github === 'saved' ? '・GitHubにも保存'
          : data.github === 'error' ? '・GitHubへの保存は次に試します' : '';
        setStatus('ok', '同期しました' + gh + '（' + hhmm() + '）');
        if (localOnly.length || pendingDel.length || newer) again = true;
      })
      .catch(function (e) {
        if (e.message === 'key') {
          setStatus('err', 'あいことばが違うみたい。下の「同期の設定」から入れ直してね');
        } else {
          setStatus('err', 'いまは送れませんでした。この端末には残っているので、次に開いたとき送ります');
        }
      })
      .then(function () {
        syncing = false;
        if (again) { again = false; setTimeout(sync, 300); }
      });
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function fmtDate(s) {
    var p = s.split('-').map(Number);
    var dt = new Date(p[0], p[1] - 1, p[2]);
    return dt.toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
  }

  function showError(msg, box) {
    var el = box || $('#f-error');
    el.textContent = msg;
    el.hidden = false;
  }

  function clearError(box) {
    var el = box || $('#f-error');
    el.textContent = '';
    el.hidden = true;
  }

  function resetForm() {
    $('#form').reset();
    $('#f-date').value = todayStr();
    clearError();
  }

  $('#form').addEventListener('submit', function (e) {
    e.preventDefault();
    clearError();
    var date = $('#f-date').value;
    var body = $('#f-body').value.trim();
    if (!date) {
      showError('見た日を入れてね。');
      $('#f-date').focus();
      return;
    }
    if (!body) {
      showError('夢の内容を少しだけでも書いてみてね。');
      $('#f-body').focus();
      return;
    }
    var tags = checkedTags($('#form'));
    var dream = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      date: date,
      title: $('#f-title').value.trim(),
      body: body,
      people: $('#f-people').value.trim(),
      tags: tags,
      created: Date.now()
    };
    dreams.push(dream);
    if (!save()) {
      dreams.pop();
      showError('保存できませんでした。もう一度試してみてね。');
      return;
    }
    resetForm();
    render();
    sync();
  });

  function checkedTags(form) {
    return Array.prototype.map.call(
      form.querySelectorAll('.chip input:checked'),
      function (i) { return i.value; }
    );
  }

  $('#f-clear').addEventListener('click', resetForm);

  // 全件をMarkdownとして手元に書き出す。検索条件や同期状態は変更しない。
  function markdownText(d) {
    var title = String(d.title || 'タイトルなし').replace(/\r?\n/g, ' ');
    var lines = ['# ' + title, '', '見た日：' + (d.date || '不明')];
    if (d.people) lines.push('登場人物：' + d.people);
    if (Array.isArray(d.tags) && d.tags.length) lines.push('気分：' + d.tags.join('、'));
    lines.push('', '## 夢の内容', '', String(d.body || ''));
    return lines.join('\n');
  }

  $('#export-md').addEventListener('click', function () {
    if (!dreams.length) {
      alert('まだ書き出す夢がないよ。');
      return;
    }
    var ordered = dreams.slice().sort(function (a, b) {
      return (a.date || '').localeCompare(b.date || '') || (a.created || 0) - (b.created || 0);
    });
    var contents = '# 夢のノート\n\n全' + ordered.length + '件\n\n---\n\n' +
      ordered.map(markdownText).join('\n\n---\n\n');
    var blob = new Blob(['\uFEFF', contents, '\n'], { type: 'text/markdown;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = 'dream-note-' + todayStr() + '.md';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  });

  $('#search').addEventListener('input', render);

  function closeEditor(id) {
    delete editors[id];
    render();
    var btn = $('#list .edit[data-id="' + CSS.escape(id) + '"]');
    if (btn) btn.focus();
  }

  // 書き直した夢を手元に保存して、保管庫へ送る
  $('#list').addEventListener('submit', function (e) {
    var form = e.target;
    if (!form.classList.contains('edit-form')) return;
    e.preventDefault();
    var box = form.querySelector('.error');
    clearError(box);
    var f = form.elements;
    var id = form.closest('li').getAttribute('data-id');
    var date = f.date.value;
    var body = f.body.value.trim();
    if (!date) {
      showError('見た日を入れてね。', box);
      f.date.focus();
      return;
    }
    if (!body) {
      showError('夢の内容を少しだけでも書いてみてね。', box);
      f.body.focus();
      return;
    }
    var i = find(id);
    if (i === -1) { closeEditor(id); return; }
    var before = dreams[i];
    dreams[i] = Object.assign({}, before, {
      date: date,
      title: f.title.value.trim(),
      body: body,
      people: f.people.value.trim(),
      tags: checkedTags(form),
      updated: Date.now()
    });
    if (!save()) {
      dreams[i] = before;
      showError('保存できませんでした。もう一度試してみてね。', box);
      return;
    }
    closeEditor(id);
    sync();
  });

  $('#list').addEventListener('click', function (e) {
    var edit = e.target.closest('.edit');
    if (edit) {
      var id = edit.getAttribute('data-id');
      var i = find(id);
      if (i === -1) return;
      var li = buildEditor(dreams[i]);
      editors[id] = li;
      edit.closest('li').replaceWith(li);
      li.querySelector('textarea').focus();
      return;
    }
    var cancel = e.target.closest('[data-act="cancel"]');
    if (cancel) {
      closeEditor(cancel.closest('li').getAttribute('data-id'));
      return;
    }
    var btn = e.target.closest('.del');
    if (!btn) return;
    if (btn.hasAttribute('data-armed')) {
      var id = btn.getAttribute('data-id');
      dreams = dreams.filter(function (d) { return d.id !== id; });
      if (pendingDel.indexOf(id) === -1) pendingDel.push(id);
      save();
      render();
      sync();
      return;
    }
    btn.setAttribute('data-armed', '');
    btn.textContent = 'やっぱり消す';
    setTimeout(function () {
      if (btn.isConnected) {
        btn.removeAttribute('data-armed');
        btn.textContent = '消す';
      }
    }, 3500);
  });

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function buildEntry(d) {
    var li = el('li', 'entry');
    var head = el('div', 'entry-head');
    head.appendChild(el('p', 'date', fmtDate(d.date)));
    if (d.title) head.appendChild(el('h3', 'title', d.title));
    li.appendChild(head);

    li.appendChild(el('p', 'body', d.body));

    if (d.people) {
      var p = el('p', 'people', '出てきた人：' + d.people);
      li.appendChild(p);
    }

    var tags = d.tags || [];
    if (tags.length) {
      var pills = el('div', 'pills');
      tags.forEach(function (t) { pills.appendChild(el('span', 'pill', t)); });
      li.appendChild(pills);
    }

    var foot = el('div', 'entry-foot');
    var edit = el('button', 'edit', '直す');
    edit.type = 'button';
    edit.setAttribute('data-id', d.id);
    foot.appendChild(edit);
    var del = el('button', 'del', '消す');
    del.type = 'button';
    del.setAttribute('data-id', d.id);
    foot.appendChild(del);
    li.appendChild(foot);
    return li;
  }

  function buildEditor(d) {
    var li = el('li', 'entry editing');
    li.setAttribute('data-id', d.id);
    var form = $('#edit-tpl').content.firstElementChild.cloneNode(true);
    var tags = $('#form .tags').cloneNode(true);
    tags.querySelectorAll('input').forEach(function (i) {
      i.checked = (d.tags || []).indexOf(i.value) !== -1;
    });
    form.insertBefore(tags, form.querySelector('.error'));
    var f = form.elements;
    f.date.value = d.date;
    f.title.value = d.title || '';
    f.body.value = d.body;
    f.people.value = d.people || '';
    li.appendChild(form);
    return li;
  }

  function render() {
    var q = $('#search').value.trim().toLowerCase();
    // 書き直している途中に別の端末で消された夢は、欄を閉じる
    Object.keys(editors).forEach(function (id) {
      if (find(id) === -1) delete editors[id];
    });
    var list = dreams
      .filter(function (d) {
        if (!q || editors[d.id]) return true;
        var hay = [d.title, d.body, d.people, (d.tags || []).join(' ')].join(' ').toLowerCase();
        return hay.indexOf(q) !== -1;
      })
      .sort(function (a, b) {
        return b.date.localeCompare(a.date) || (b.created - a.created);
      });

    // 書き直している途中の欄は動かさずに残し、そのまわりだけ作り直す
    // （作り直すと、同期のたびに打ちかけの文字やスマホのキーボードが消えてしまうので）
    var ul = $('#list');
    // 「直す」「消す」にカーソルがあったら、作り直したあとも同じボタンに戻す
    var was = document.activeElement;
    var back = was && was.matches('#list .entry-foot button')
      ? '.' + was.className + '[data-id="' + CSS.escape(was.getAttribute('data-id')) + '"]'
      : null;
    Array.prototype.slice.call(ul.children).forEach(function (n) {
      if (editors[n.getAttribute('data-id')] !== n) ul.removeChild(n);
    });
    var at = ul.firstChild;
    list.forEach(function (d) {
      var kept = editors[d.id];
      if (kept) { at = kept.nextSibling; return; }
      ul.insertBefore(buildEntry(d), at);
    });
    if (back) {
      var btn = ul.querySelector(back);
      if (btn) btn.focus({ preventScroll: true });
    }

    $('#count').textContent = q
      ? '（' + list.length + ' / ' + dreams.length + '件）'
      : (dreams.length ? '（' + dreams.length + '件）' : '');

    var empty = $('#empty');
    if (dreams.length === 0) {
      empty.textContent = 'まだ夢は書かれていません。目が覚めて、いちばん残っている場面から書いてみてね。';
      empty.hidden = false;
    } else if (list.length === 0) {
      empty.textContent = '見つからなかったよ。別の言葉で探してみて。';
      empty.hidden = false;
    } else {
      empty.hidden = true;
    }
    // 夢が増えたり書き直されたりしたら、整理の欄の数字もそろえる
    if (typeof renderSummary === 'function' && summaryOpen) renderSummary();
  }

  // ---- AIで整理する ----
  // 夢を1件ずつAIに読ませて「事実カード」（人物・場所・食べ物…）を作り、保管しておく。
  // まだカードがない夢と、書き直した夢だけを読ませるので、夢が増えても1回ぶんの重さは変わらない。
  // 数えたり並べたりするのはこのページの中（AIなし）。気分のタグも、ここでそのまま数える。
  var CARDS_KEY = 'dream-cards-v1';
  var OPEN_KEY = 'dream-summary-open-v1';
  try { localStorage.removeItem('dream-summary-v1'); } catch (e) {}
  var cards = loadCards();
  var summaryOpen = loadText(OPEN_KEY) === '1';
  var summarizing = false;

  function loadCards() {
    try {
      var v = JSON.parse(localStorage.getItem(CARDS_KEY));
      return v && typeof v === 'object' && !Array.isArray(v) ? v : {};
    } catch (e) {
      return {};
    }
  }

  // 手元にない夢（消した夢）のカードは、この端末からも片づける
  function pruneCards() {
    var ids = {};
    dreams.forEach(function (d) { ids[d.id] = true; });
    var changed = false;
    Object.keys(cards).forEach(function (id) {
      if (!ids[id]) { delete cards[id]; changed = true; }
    });
    if (changed) saveCards();
  }

  function saveCards() {
    try { localStorage.setItem(CARDS_KEY, JSON.stringify(cards)); } catch (e) {}
  }

  function setOpen(v) {
    summaryOpen = v;
    try {
      if (v) localStorage.setItem(OPEN_KEY, '1');
      else localStorage.removeItem(OPEN_KEY);
    } catch (e) {}
  }

  function setSummaryStatus(state, text) {
    var s = $('#summary-status');
    s.setAttribute('data-state', state);
    s.textContent = text;
    s.hidden = !text;
    $('#summary').hidden = false;
  }

  // その夢のカードが、いまの夢の中身から作ったものか
  function fresh(d) {
    var c = cards[d.id];
    return !!(c && c.card && c.stamp === stamp(d));
  }

  // 待っているあいだに届く空白も含めて、最後まで受け取ってから読む
  function readJSON(r) {
    return r.text().then(function (t) {
      var data = {};
      try { data = JSON.parse(t); } catch (e) {}
      return { status: r.status, data: data };
    });
  }

  function checkStatus(res) {
    if (res.status === 401) throw new Error('あいことばが違うみたい。下の「同期の設定」から入れ直してね。');
    if (res.status === 404) throw new Error('この場所では、まだAIの整理が使えません。');
    if (res.data.error) throw new Error(res.data.error);
    return res.data;
  }

  // 別の端末で作ったカードも受け取る
  function fetchCards() {
    return fetch(API_BASE + '/api/card', {
      headers: { 'x-dream-key': encodeURIComponent(syncKey) }
    }).then(readJSON).then(checkStatus).then(function (data) {
      var got = data.cards || {};
      Object.keys(got).forEach(function (id) {
        var c = got[id];
        if (find(id) === -1) return;
        if (c && c.card && (!cards[id] || (c.at || 0) >= (cards[id].at || 0))) cards[id] = c;
      });
      saveCards();
      pruneCards();
    });
  }

  function makeCard(d) {
    return fetch(API_BASE + '/api/card', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-dream-key': encodeURIComponent(syncKey) },
      body: JSON.stringify({
        dream: { id: d.id, stamp: stamp(d), date: d.date, title: d.title, body: d.body, people: d.people }
      })
    }).then(readJSON).then(checkStatus).then(function (data) {
      if (!data.card) throw new Error('AIの返事が読み取れませんでした。もう一度試してみてね。');
      cards[d.id] = data;
      saveCards();
    });
  }

  $('#ai-summary').addEventListener('click', function () {
    if (summarizing) return;
    setOpen(true);
    renderSummary();
    if (!CAN_SYNC || !syncKey) {
      setSummaryStatus('err', 'カードを作るには、ページのいちばん下の「同期の設定」で、あいことばを入れてつないでね。');
      return;
    }
    var btn = $('#ai-summary');
    summarizing = true;
    btn.disabled = true;
    btn.textContent = '整理しています…';
    setSummaryStatus('busy', 'これまでのカードを確かめています…');

    var todo = [];
    var done = 0;
    fetchCards()
      .catch(function (e) {
        // 受け取れなくても、手元のカードで続ける（あいことば違いだけは止める）
        if (/あいことば/.test(e.message)) throw e;
      })
      .then(function () {
        todo = dreams.filter(function (d) { return !fresh(d); }).sort(function (a, b) {
          return (a.date || '').localeCompare(b.date || '') || (a.created || 0) - (b.created || 0);
        });
        renderSummary();
        // 1件ずつ順番に読ませる。途中で止まっても、できたカードは残る。
        function next() {
          if (done >= todo.length) return;
          setSummaryStatus('busy', '新しい夢をAIが読んでいます（' + (done + 1) + ' / ' + todo.length + '件目）');
          return makeCard(todo[done]).then(function () {
            done++;
            renderSummary();
            return next();
          });
        }
        return next();
      })
      .then(function () {
        var msg = todo.length
          ? '新しく' + todo.length + '件の夢をカードにしました。'
          : 'すべての夢がカードになっています。';
        setSummaryStatus('busy', msg + 'GitHubに控えを置いています…');
        return saveSummary().then(function (gh) {
          setSummaryStatus('ok', msg + gh);
        });
      })
      .catch(function (e) {
        var msg = e instanceof TypeError
          ? 'AIの整理を呼び出せませんでした。電波のよいところで、もう一度試してね。'
          : e.message;
        if (done) msg += '（' + done + '件はカードにできたので、残しておきます）';
        setSummaryStatus('err', msg);
      })
      .then(function () {
        summarizing = false;
        btn.disabled = false;
        btn.textContent = 'AIで整理する';
        renderSummary();
      });
  });

  $('#summary-close').addEventListener('click', function () {
    setOpen(false);
    $('#summary').hidden = true;
    $('#summary-status').textContent = '';
    $('#summary-body').textContent = '';
  });

  var GROUPS = [
    ['people', '人物'],
    ['places', '場所'],
    ['foods', '食べ物'],
    ['moves', '乗り物・移動'],
    ['tech', 'AI・IT・作業']
  ];
  var RESULTS = [['解決できた', 'res-ok'], ['解決できなかった', 'res-ng'], ['結果不明', 'res-unknown']];
  var SCENES = [
    ['changes', '変化・すり替わり', '何かが別のものに変わる場面は見つかりませんでした。',
      function (x) { return x.before + ' → ' + x.after; }],
    ['notReal', 'できたと思ったら夢だった', '現実だと思ったら夢だった場面は見つかりませんでした。',
      function (x) { return x.what; }]
  ];

  function dreamLabel(d) {
    return fmtDate(d.date) + (d.title ? '「' + d.title + '」' : '');
  }

  // カードを数えて、画面とMarkdownの両方で使う形にまとめる
  function collect() {
    pruneCards();
    var ordered = dreams.slice().sort(function (a, b) {
      return (a.date || '').localeCompare(b.date || '') || (a.created || 0) - (b.created || 0);
    });
    var withCard = ordered.filter(fresh);
    var out = { total: ordered.length, carded: withCard.length };

    // 気分：記録されたタグをそのまま数える（AIなし）
    var moods = {};
    ordered.forEach(function (d) {
      (d.tags || []).forEach(function (t) { moods[t] = (moods[t] || 0) + 1; });
    });
    out.moods = Object.keys(moods).sort(function (a, b) { return moods[b] - moods[a]; })
      .map(function (t) { return { name: t, n: moods[t] }; });

    // 項目ごとに、同じ名前のものを束ねて数える（同じ夢は1件と数える）
    out.groups = GROUPS.map(function (g) {
      var byName = {};
      var dreamsIn = 0;
      withCard.forEach(function (d) {
        var items = cards[d.id].card[g[0]] || [];
        var seen = {};
        if (items.length) dreamsIn++;
        items.forEach(function (it) {
          var name = String(it.name || '').trim();
          if (!name || seen[name]) return;
          seen[name] = true;
          (byName[name] = byName[name] || []).push({ d: d, quote: it.quote });
        });
      });
      var names = Object.keys(byName).sort(function (a, b) {
        return byName[b].length - byName[a].length;
      }).map(function (name) { return { name: name, list: byName[name] }; });
      return { label: g[1], dreamsIn: dreamsIn, names: names };
    });

    out.outcomes = [];
    withCard.forEach(function (d) {
      (cards[d.id].card.outcomes || []).forEach(function (o) { out.outcomes.push({ d: d, o: o }); });
    });

    out.scenes = SCENES.map(function (s) {
      var list = [];
      withCard.forEach(function (d) {
        (cards[d.id].card[s[0]] || []).forEach(function (x) { list.push({ d: d, x: x }); });
      });
      var n = {};
      list.forEach(function (it) { n[it.d.id] = true; });
      return { label: s[1], empty: s[2], text: s[3], dreamsIn: Object.keys(n).length, list: list };
    });
    return out;
  }

  function renderSummary() {
    var box = $('#summary-body');
    box.textContent = '';
    if (!summaryOpen) return;
    $('#summary').hidden = false;
    var s = collect();
    var missing = s.total - s.carded;

    function addQuote(parent, q) {
      if (q) parent.appendChild(el('p', 'quote', '「' + q + '」'));
    }
    function heading(text, n) {
      var h = el('h3', null, text);
      if (n != null) h.appendChild(el('span', 'fact-count', n + '件の夢'));
      box.appendChild(h);
    }
    function nothing(text) { box.appendChild(el('p', 'nothing', text)); }

    box.appendChild(el('p', 'summary-meta', s.carded + ' / ' + s.total + '件の夢がカードになっています' +
      (missing ? '（残り' + missing + '件は「AIで整理する」でカードになります）' : '')));

    heading('目が覚めたときに残っている感じ');
    if (!s.moods.length) {
      nothing('まだ記録されていません。');
    } else {
      var mt = el('div', 'tally');
      s.moods.forEach(function (m) {
        var chip = el('span', null, m.name);
        chip.appendChild(el('b', null, m.n + '件'));
        mt.appendChild(chip);
      });
      box.appendChild(mt);
    }
    if (!s.carded) return;

    s.groups.forEach(function (g) {
      heading(g.label, g.dreamsIn);
      if (!g.names.length) { nothing('記録の中には見つかりませんでした。'); return; }
      var ul = el('ul', 'facts');
      g.names.forEach(function (nm) {
        var li = el('li');
        var det = el('details');
        var sum = el('summary', 'fact-head');
        sum.appendChild(el('span', 'fact-label', nm.name));
        sum.appendChild(el('span', 'fact-count', nm.list.length + '件'));
        det.appendChild(sum);
        var ev = el('ul', 'evidence');
        nm.list.forEach(function (x) {
          var item = el('li');
          item.appendChild(el('span', 'fact-dream', dreamLabel(x.d)));
          addQuote(item, x.quote);
          ev.appendChild(item);
        });
        det.appendChild(ev);
        li.appendChild(det);
        ul.appendChild(li);
      });
      box.appendChild(ul);
    });

    heading('問題と結果');
    if (!s.outcomes.length) {
      nothing('問題への対処が描かれた記録は見つかりませんでした。');
    } else {
      var tally = el('div', 'tally');
      RESULTS.forEach(function (k) {
        var n = s.outcomes.filter(function (x) { return x.o.result === k[0]; }).length;
        var chip = el('span', null, k[0]);
        chip.appendChild(el('b', null, n + '件'));
        tally.appendChild(chip);
      });
      box.appendChild(tally);
      var ol = el('ul', 'facts');
      RESULTS.forEach(function (k) {
        s.outcomes.filter(function (x) { return x.o.result === k[0]; }).forEach(function (x) {
          var li = el('li');
          var head = el('div', 'fact-head');
          head.appendChild(el('span', 'pill ' + k[1], k[0]));
          head.appendChild(el('span', 'fact-dream', dreamLabel(x.d)));
          li.appendChild(head);
          li.appendChild(el('p', 'fact-text', '問題：' + x.o.problem + '\n行動：' + x.o.action));
          addQuote(li, x.o.quote);
          ol.appendChild(li);
        });
      });
      box.appendChild(ol);
    }

    s.scenes.forEach(function (sc) {
      heading(sc.label, sc.dreamsIn);
      if (!sc.list.length) { nothing(sc.empty); return; }
      var ul = el('ul', 'facts');
      sc.list.forEach(function (it) {
        var li = el('li');
        li.appendChild(el('span', 'fact-dream', dreamLabel(it.d)));
        li.appendChild(el('p', 'fact-text', sc.text(it.x)));
        addQuote(li, it.x.quote);
        ul.appendChild(li);
      });
      box.appendChild(ul);
    });

    box.appendChild(el('p', 'summary-note',
      'AIが夢を1件ずつ読んで抜き出したものです。名前の書き方が違うと別々に数えられることがあるので、' +
      '全体をじっくり眺めたいときは「Markdownで書き出す」でNotebookLMに読ませてみてね。'));
  }

  // 整理の結果をMarkdownにする（GitHubの summary.md に置く中身）。日時は窓口の側で足す。
  function summaryMarkdown() {
    var s = collect();
    var L = [];
    function q(t) { return t ? '「' + String(t).replace(/\r?\n/g, ' ') + '」' : ''; }
    L.push('カードになった夢：' + s.carded + ' / ' + s.total + '件', '');
    L.push('## 目が覚めたときに残っている感じ', '');
    if (!s.moods.length) L.push('まだ記録されていません。');
    s.moods.forEach(function (m) { L.push('- ' + m.name + '：' + m.n + '件'); });
    s.groups.forEach(function (g) {
      L.push('', '## ' + g.label + '（' + g.dreamsIn + '件の夢）', '');
      if (!g.names.length) { L.push('記録の中には見つかりませんでした。'); return; }
      g.names.forEach(function (nm) {
        L.push('- **' + nm.name + '**（' + nm.list.length + '件）');
        nm.list.forEach(function (x) { L.push('  - ' + dreamLabel(x.d) + '：' + q(x.quote)); });
      });
    });
    L.push('', '## 問題と結果', '');
    if (!s.outcomes.length) {
      L.push('問題への対処が描かれた記録は見つかりませんでした。');
    } else {
      RESULTS.forEach(function (k) {
        var list = s.outcomes.filter(function (x) { return x.o.result === k[0]; });
        L.push('### ' + k[0] + '（' + list.length + '件）', '');
        list.forEach(function (x) {
          L.push('- ' + dreamLabel(x.d));
          L.push('  - 問題：' + x.o.problem);
          L.push('  - 行動：' + x.o.action);
          if (x.o.quote) L.push('  - 根拠：' + q(x.o.quote));
        });
        L.push('');
      });
    }
    s.scenes.forEach(function (sc) {
      L.push('', '## ' + sc.label + '（' + sc.dreamsIn + '件の夢）', '');
      if (!sc.list.length) { L.push(sc.empty); return; }
      sc.list.forEach(function (it) {
        L.push('- ' + dreamLabel(it.d) + '：' + sc.text(it.x) + (it.x.quote ? ' ' + q(it.x.quote) : ''));
      });
    });
    return L.join('\n');
  }

  // GitHub に控えを置く。うまくいかなくても整理そのものは止めない。
  function saveSummary() {
    return fetch(API_BASE + '/api/summary-md', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-dream-key': encodeURIComponent(syncKey) },
      body: JSON.stringify({ markdown: summaryMarkdown() })
    }).then(readJSON).then(function (res) {
      var g = res.data && res.data.github;
      return g === 'saved' ? 'GitHubにも保存しました。'
        : g === 'same' ? 'GitHubの控えは最新です。'
        : g === 'off' ? ''
        : 'GitHubへの保存はうまくいきませんでした。次に整理したときにもう一度試します。';
    }, function () {
      return 'GitHubへの保存はうまくいきませんでした。次に整理したときにもう一度試します。';
    });
  }

  $('#sync-form').addEventListener('submit', function (e) {
    e.preventDefault();
    syncKey = $('#sync-key').value.trim();
    try {
      if (syncKey) localStorage.setItem(SYNC_KEY, syncKey);
      else localStorage.removeItem(SYNC_KEY);
    } catch (err) {}
    $('#sync-key').value = '';
    $('#sync-box').open = false;
    sync();
  });

  // スマホでアプリを切り替えて戻ってきたときや、電波が戻ったときにも同期する
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') sync();
  });
  window.addEventListener('online', sync);

  $('#f-date').value = todayStr();
  render();
  renderSummary();
  sync();
})();
</script>

</body></html>
