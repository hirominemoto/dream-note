<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#1c1d34;color:#ebe7f6}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>夢のノート</title>
<style>
/* Layout: one quiet column of soft glass slips, like pages of a notebook kept by the bedside.
   Palette: midnight indigo with moonlit rose. 端末の明るさ設定にかかわらず、いつも夜の色で表示する。 */
:root {
  color-scheme: dark;
  --bg: #1c1d34;
  --ink: #ebe7f6;
  --muted: #a19cc0;
  --accent: #c7a6e8;
  --accent-ink: #1c1d34;
  --glow: #f1d88f;
  --alert: #f0a2b8;
  --haze: rgba(120, 96, 170, 0.34);
  --haze-2: rgba(214, 170, 110, 0.16);
  --card: rgba(255, 255, 255, 0.055);
  --field: rgba(255, 255, 255, 0.07);
  --line: rgba(255, 255, 255, 0.11);
  --shadow: 0 18px 40px -26px rgba(0, 0, 0, 0.6);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1c1d34;
    --ink: #ebe7f6;
    --muted: #a19cc0;
    --accent: #c7a6e8;
    --accent-ink: #1c1d34;
    --glow: #f1d88f;
    --alert: #f0a2b8;
    --haze: rgba(120, 96, 170, 0.34);
    --haze-2: rgba(214, 170, 110, 0.16);
    --card: rgba(255, 255, 255, 0.055);
    --field: rgba(255, 255, 255, 0.07);
    --line: rgba(255, 255, 255, 0.11);
    --shadow: 0 18px 40px -26px rgba(0, 0, 0, 0.6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1c1d34;
  --ink: #ebe7f6;
  --muted: #a19cc0;
  --accent: #c7a6e8;
  --accent-ink: #1c1d34;
  --glow: #f1d88f;
  --alert: #f0a2b8;
  --haze: rgba(120, 96, 170, 0.34);
  --haze-2: rgba(214, 170, 110, 0.16);
  --card: rgba(255, 255, 255, 0.055);
  --field: rgba(255, 255, 255, 0.07);
  --line: rgba(255, 255, 255, 0.11);
  --shadow: 0 18px 40px -26px rgba(0, 0, 0, 0.6);
}

body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: Meiryo, "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif;
  font-size: 15px;
  line-height: 1.85;
}
/* Soft haze behind everything, and a few faint stars. */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  background:
    radial-gradient(60% 45% at 12% 0%, var(--haze), transparent 70%),
    radial-gradient(50% 40% at 100% 22%, var(--haze-2), transparent 70%);
}
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: 0.55;
  background-image:
    radial-gradient(1.5px 1.5px at 8% 18%, var(--glow), transparent),
    radial-gradient(1px 1px at 27% 62%, var(--ink), transparent),
    radial-gradient(1.5px 1.5px at 61% 9%, var(--glow), transparent),
    radial-gradient(1px 1px at 84% 44%, var(--ink), transparent),
    radial-gradient(1px 1px at 46% 86%, var(--glow), transparent),
    radial-gradient(1px 1px at 93% 88%, var(--ink), transparent);
}

*, *::before, *::after { box-sizing: border-box; }

.wrap {
  max-width: 680px;
  margin: 0 auto;
  padding-block: 44px 96px;
  padding-inline: 18px;
}

/* Header */
.top {
  text-align: center;
  margin-bottom: 30px;
}
.moon {
  width: 46px;
  height: 46px;
  margin: 0 auto 14px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #fffaf0, var(--glow) 70%);
  box-shadow: 0 0 28px 4px color-mix(in srgb, var(--glow) 35%, transparent);
}
.sky {
  position: relative;
  width: min(240px, 100%);
  height: 130px;
  margin: 0 auto 10px;
}
.sky .moon {
  position: absolute;
  left: 50%;
  top: 50%;
  margin: 0;
  transform: translate(-50%, -50%);
}
.star {
  position: absolute;
  background: var(--glow);
  clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
  filter: drop-shadow(0 0 3px var(--glow));
  opacity: 0.4;
  animation: twinkle 2.8s ease-in-out infinite;
}
.star:nth-child(2n) { animation-delay: -1.2s; }
.star:nth-child(3n) { animation-delay: -2.1s; }
.star:nth-child(5n) { animation-delay: -0.6s; }
@keyframes twinkle {
  0%, 100% { opacity: 0.35; transform: scale(0.8) rotate(0deg); }
  50% { opacity: 1; transform: scale(1.1) rotate(18deg); }
}
@media (prefers-reduced-motion: reduce) {
  .star { animation: none; opacity: 0.8; }
}

.kicker {
  margin: 0;
  font-size: 12px;
  letter-spacing: 0.22em;
  color: var(--accent);
}
h1 {
  margin: 4px 0 6px;
  font-size: 30px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-wrap: balance;
}
.lede {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
  text-wrap: balance;
}

/* Surfaces */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 22px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
h2 {
  margin: 0 0 14px;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 0.04em;
}

/* Form */
form { display: grid; gap: 16px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > span {
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 0.04em;
}
.row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
}
.row > * { min-width: 0; }
input[type="text"],
input[type="date"],
input[type="search"],
textarea {
  width: 100%;
  font: inherit;
  font-size: 15px;
  color: var(--ink);
  background: var(--field);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 13px;
  transition: border-color 0.2s ease, background 0.2s ease;
}
textarea {
  resize: vertical;
  min-height: 140px;
  line-height: 1.85;
}
input::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.75; }
input:focus, textarea:focus { outline: none; border-color: var(--accent); }
input:focus-visible, textarea:focus-visible, button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Feeling chips */
.tags {
  border: 0;
  padding: 0;
  margin: 0;
  min-width: 0;
}
.tags legend {
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 0.04em;
  padding: 0;
  margin-bottom: 8px;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.chip { position: relative; cursor: pointer; }
.chip input {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
  pointer-events: none;
}
.chip span {
  display: inline-block;
  padding: 5px 14px;
  font-size: 13px;
  color: var(--muted);
  background: var(--field);
  border: 1px solid var(--line);
  border-radius: 999px;
  transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
}
.chip:hover span { border-color: var(--accent); }
.chip input:checked + span {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: transparent;
}
.chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.error {
  margin: 0;
  font-size: 14px;
  color: var(--alert);
}
.error[hidden] { display: none; }

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: flex-end;
}
button {
  font: inherit;
  font-size: 14px;
  cursor: pointer;
  border-radius: 999px;
  padding: 9px 20px;
  transition: filter 0.2s ease, background 0.2s ease, color 0.2s ease;
}
.primary {
  background: var(--accent);
  color: var(--accent-ink);
  border: 0;
  font-weight: 700;
  padding: 10px 26px;
}
.primary:hover { filter: brightness(1.06); }
.ghost {
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--line);
}
.ghost:hover { color: var(--ink); border-color: var(--accent); }

/* List head */
.list-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 44px 4px 16px;
}
.list-head h2 { margin: 0; }
.count {
  font-weight: 400;
  font-size: 13px;
  color: var(--muted);
  margin-left: 4px;
}
#search {
  width: min(100%, 240px);
  font-size: 14px;
  padding: 8px 14px;
}

/* Export and search controls */
.list-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.list-tools #search { flex: 1 1 170px; }

/* Entries */
.entries {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 14px;
}
.entry {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 18px 20px 14px;
  min-width: 0;
}
.entry-head { display: grid; gap: 2px; min-width: 0; }
.date {
  margin: 0;
  font-size: 12px;
  letter-spacing: 0.06em;
  color: var(--muted);
}
.title {
  margin: 0;
  font-size: 16px;
  font-weight: 700;
  overflow-wrap: anywhere;
}
.body {
  margin: 10px 0 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.people {
  margin: 10px 0 0;
  font-size: 13px;
  color: var(--muted);
  overflow-wrap: anywhere;
}
.pills {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}
.pill {
  font-size: 12px;
  color: var(--accent);
  border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
  border-radius: 999px;
  padding: 1px 10px;
}
.entry-foot {
  display: flex;
  justify-content: flex-end;
  gap: 4px;
  margin-top: 8px;
}
.entry-foot button {
  background: transparent;
  color: var(--muted);
  border: 0;
  padding: 4px 8px;
  font-size: 13px;
}
.edit:hover { color: var(--accent); }
.del:hover, .del[data-armed] { color: var(--alert); }
.entry.editing {
  border-color: color-mix(in srgb, var(--accent) 45%, transparent);
  padding-bottom: 18px;
}

.empty {
  text-align: center;
  color: var(--muted);
  padding: 36px 16px;
  border: 1px dashed var(--line);
  border-radius: 18px;
  margin: 0;
  text-wrap: balance;
}
.empty[hidden] { display: none; }

/* Sync */
.sync-status {
  margin: 12px 0 0;
  font-size: 12px;
  letter-spacing: 0.04em;
  color: var(--muted);
}
.sync-status::before {
  content: "";
  display: inline-block;
  width: 7px;
  height: 7px;
  margin-right: 7px;
  border-radius: 50%;
  vertical-align: 1px;
  background: var(--muted);
  opacity: 0.6;
}
.sync-status[data-state="ok"]::before { background: var(--glow); opacity: 1; box-shadow: 0 0 6px var(--glow); }
.sync-status[data-state="busy"]::before { background: var(--accent); opacity: 1; }
.sync-status[data-state="err"] { color: var(--alert); }
.sync-status[data-state="err"]::before { background: var(--alert); opacity: 1; }

.sync-box {
  margin-top: 44px;
  font-size: 13px;
  color: var(--muted);
}
.sync-box summary {
  cursor: pointer;
  width: fit-content;
  margin: 0 auto;
  letter-spacing: 0.04em;
}
.sync-box summary:hover { color: var(--ink); }
.sync-box .card { margin-top: 14px; }
.sync-box p { margin: 0 0 12px; }
.sync-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.sync-row input { flex: 1 1 180px; min-width: 0; }
.sync-row input[type="text"] {
  font: inherit;
  font-size: 15px;
  color: var(--ink);
  background: var(--field);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 9px 13px;
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>

<main class="wrap">
  <header class="top">
    <div class="sky" aria-hidden="true">
      <div class="moon"></div>
      <span class="star" style="left:4%;top:22%;width:8px;height:8px"></span>
      <span class="star" style="left:14%;top:72%;width:5px;height:5px"></span>
      <span class="star" style="left:26%;top:6%;width:6px;height:6px"></span>
      <span class="star" style="left:72%;top:4%;width:5px;height:5px"></span>
      <span class="star" style="left:86%;top:34%;width:9px;height:9px"></span>
      <span class="star" style="left:92%;top:78%;width:5px;height:5px"></span>
      <span class="star" style="left:60%;top:86%;width:7px;height:7px"></span>
      <span class="star" style="left:38%;top:92%;width:4px;height:4px"></span>
    </div>
    <p class="kicker">DREAM LOG</p>
    <h1>夢のノート</h1>
    <p class="lede">目が覚めて残っている断片を、そのまま置いておく場所。</p>
    <p class="sync-status" id="sync-status" role="status"></p>
  </header>

  <section class="card" aria-labelledby="compose-title">
    <h2 id="compose-title">いまの夢を書く</h2>
    <form id="form" novalidate>
      <div class="row">
        <label class="field">
          <span>見た日</span>
          <input type="date" id="f-date" required>
        </label>
        <label class="field">
          <span>タイトル（なくてもいい）</span>
          <input type="text" id="f-title" maxlength="60" placeholder="例：白い傘の駅">
        </label>
      </div>

      <label class="field">
        <span>夢の内容</span>
        <textarea id="f-body" placeholder="場面、色、におい。順番がばらばらでもいいよ。"></textarea>
      </label>

      <label class="field">
        <span>出てきた人</span>
        <input type="text" id="f-people" placeholder="名前でも、雰囲気でもいい">
      </label>

      <fieldset class="tags">
        <legend>目が覚めたときに残っている感じ</legend>
        <div class="chips">
          <label class="chip"><input type="checkbox" value="鮮明"><span>鮮明</span></label>
          <label class="chip"><input type="checkbox" value="ぼんやり"><span>ぼんやり</span></label>
          <label class="chip"><input type="checkbox" value="こわい"><span>こわい</span></label>
          <label class="chip"><input type="checkbox" value="なつかしい"><span>なつかしい</span></label>
          <label class="chip"><input type="checkbox" value="うれしい"><span>うれしい</span></label>
          <label class="chip"><input type="checkbox" value="不思議"><span>不思議</span></label>

      </fieldset>

      <p class="error" id="f-error" role="alert" hidden></p>

      <div class="actions">
        <button type="button" id="f-clear" class="ghost">クリア</button>

  <div class="list-head">
    <h2>これまでの夢 <span class="count" id="count"></span></h2>
    <div class="list-tools"><button type="button" id="export-md" class="ghost">Markdownで書き出す</button>
    <input type="search" id="search" placeholder="言葉で探す" aria-label="夢を探す"></div>
  </div>

  <ul class="entries" id="list"></ul>
  <p class="empty" id="empty" hidden></p>

  <!-- 書いた夢を、その場で書き直すための欄。感じのチップは「いまの夢を書く」から写して入れる -->
  <template id="edit-tpl">
    <form class="edit-form" novalidate aria-label="夢を書き直す">
      <div class="row">
        <label class="field">
          <span>見た日</span>
          <input type="date" name="date" required>
        </label>
        <label class="field">
          <span>タイトル（なくてもいい）</span>
          <input type="text" name="title" maxlength="60">
        </label>
      </div>
      <label class="field">
        <span>夢の内容</span>
        <textarea name="body"></textarea>
      </label>
      <label class="field">
        <span>出てきた人</span>

  <details class="sync-box" id="sync-box">
    <summary>同期の設定</summary>
    <div class="card">
      <p>PCとスマホで同じノートを見るための「あいことば」。どの端末でも同じものを入れてね。</p>
      <form class="sync-row" id="sync-form">
        <input type="text" id="sync-key" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="あいことば（ひらがなでもOK）" aria-label="あいことば">
        <button type="submit" class="primary">つなぐ</button>
      </form>
    </div>
  </details>
</main>

<script>
(function () {
  var KEY = 'dream-journal-v1';
  var DEL_KEY = 'dream-pending-delete-v1';
  var SYNC_KEY = 'dream-sync-key-v1';
  // 保管庫の場所。Netlifyで開いたときは同じ場所にあるので空でOK。
  // GitHub Pagesで開いたときは、ここに書いたNetlifyのアドレスへ見に行く（例：'https://xxxx.netlify.app'）。
  var NETLIFY_URL = 'https://cheery-yeot-d31a3a.netlify.app';
  var ON_PAGES = /\.github\.io$/.test(location.hostname);
  var API_BASE = ON_PAGES ? NETLIFY_URL : '';
  var CAN_SYNC = !ON_PAGES || !!NETLIFY_URL;
  var dreams = load();
  var pendingDel = loadList(DEL_KEY);
  var syncKey = loadText(SYNC_KEY);
  var syncing = false;
  var again = false;
  var editors = {}; // 書き直している途中の欄（夢の id → 欄）
  var $ = function (s) { return document.querySelector(s); };

  // 夢がいつの版かを表す。書き直していない夢は updated を持たないので、書いた時刻で比べる
  function stamp(d) { return Number(d.updated || d.created) || 0; }

  function find(id) {
    for (var i = 0; i < dreams.length; i++) if (dreams[i].id === id) return i;
    return -1;
  }

  function load() {
    try {
      var v = JSON.parse(localStorage.getItem(KEY));
      return Array.isArray(v) ? v : [];
    } catch (e) {
      return [];
    }
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(dreams));
      localStorage.setItem(DEL_KEY, JSON.stringify(pendingDel));
      return true;
    } catch (e) {
      return false;
    }
  }

  function loadList(k) {
    try {
      var v = JSON.parse(localStorage.getItem(k));
      return Array.isArray(v) ? v : [];
    } catch (e) {
      return [];
    }
  }

  function loadText(k) {
    try { return localStorage.getItem(k) || ''; } catch (e) { return ''; }
  }

  function hhmm() {
    var d = new Date();
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function setStatus(state, text) {
    var el = $('#sync-status');
    el.setAttribute('data-state', state);
    el.textContent = text;
  }

  // 手元のノートと保管庫を突き合わせる。
  // 手元にしかない夢は送り、消した夢は「消した」と伝え、返ってきた全体を手元に写す。
  function sync() {
    if (!CAN_SYNC) {
      setStatus('off', 'この端末だけに保存しています');
      return;
    }
    if (!syncKey) {
      setStatus('off', 'この端末だけに保存しています（下の「同期の設定」でつなげられます）');
      return;
    }
    if (syncing) { again = true; return; }
    syncing = true;
    setStatus('busy', '同期しています…');
    fetch(API_BASE + '/api/dreams', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-dream-key': encodeURIComponent(syncKey) },
      body: JSON.stringify({ upsert: dreams, delete: pendingDel })
    })
      .then(function (r) {
        if (r.status === 401) throw new Error('key');
        if (!r.ok) throw new Error('server');
        return r.json();
      })
      .then(function (data) {
        var sentDel = pendingDel.slice();
        // 送っている間に増えた夢・消した夢は手元に残しておき、次の同期で送る
        var serverIds = {};
        data.dreams.forEach(function (d) { serverIds[d.id] = true; });
        var gone = {};
        data.deleted.forEach(function (id) { gone[id] = true; });
        var localOnly = dreams.filter(function (d) { return !serverIds[d.id] && !gone[d.id]; });
        // 送っている間に手元で書き直した夢は、手元の版を残しておき、次の同期で送る
        var mine = {};
        dreams.forEach(function (d) { mine[d.id] = d; });
        var newer = false;
        var fromServer = data.dreams.map(function (d) {
          var m = mine[d.id];
          if (m && stamp(m) > stamp(d)) { newer = true; return m; }
          return d;
        });
        pendingDel = pendingDel.filter(function (id) { return sentDel.indexOf(id) === -1; });
        dreams = fromServer.concat(localOnly).filter(function (d) { return pendingDel.indexOf(d.id) === -1; });
        save();
        render();
        var gh = data.github === 'saved' ? '・GitHubにも保存'
          : data.github === 'error' ? '・GitHubへの保存は次に試します' : '';
        setStatus('ok', '同期しました' + gh + '（' + hhmm() + '）');
        if (localOnly.length || pendingDel.length || newer) again = true;
      })
      .catch(function (e) {
        if (e.message === 'key') {
          setStatus('err', 'あいことばが違うみたい。下の「同期の設定」から入れ直してね');
        } else {
          setStatus('err', 'いまは送れませんでした。この端末には残っているので、次に開いたとき送ります');
        }
      })
      .then(function () {
        syncing = false;
        if (again) { again = false; setTimeout(sync, 300); }
      });
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function fmtDate(s) {
    var p = s.split('-').map(Number);
    var dt = new Date(p[0], p[1] - 1, p[2]);
    return dt.toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
  }

  function showError(msg, box) {
    var el = box || $('#f-error');
    el.textContent = msg;
    el.hidden = false;
  }

  function clearError(box) {
    var el = box || $('#f-error');
    el.textContent = '';
    el.hidden = true;
  }

  function resetForm() {
    $('#form').reset();
    $('#f-date').value = todayStr();
    clearError();
  }

  $('#form').addEventListener('submit', function (e) {
    e.preventDefault();
    clearError();
    var date = $('#f-date').value;
    var body = $('#f-body').value.trim();
    if (!date) {
      showError('見た日を入れてね。');
      $('#f-date').focus();
      return;
    }
    if (!body) {
      showError('夢の内容を少しだけでも書いてみてね。');
      $('#f-body').focus();
      return;
    }
    var tags = checkedTags($('#form'));
    var dream = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      date: date,
      title: $('#f-title').value.trim(),
      body: body,
      people: $('#f-people').value.trim(),
      tags: tags,
      created: Date.now()
    };
    dreams.push(dream);
    if (!save()) {
      dreams.pop();
      showError('保存できませんでした。もう一度試してみてね。');
      return;
    }
    resetForm();
    render();
    sync();
  });

  function checkedTags(form) {
    return Array.prototype.map.call(
      form.querySelectorAll('.chip input:checked'),
      function (i) { return i.value; }
    );
  }

  $('#f-clear').addEventListener('click', resetForm);

  // 全件をMarkdownとして手元に書き出す。検索条件や同期状態は変更しない。
  function markdownText(d) {
    var title = String(d.title || 'タイトルなし').replace(/\r?\n/g, ' ');
    var lines = ['# ' + title, '', '見た日：' + (d.date || '不明')];
    if (d.people) lines.push('登場人物：' + d.people);
    if (Array.isArray(d.tags) && d.tags.length) lines.push('気分：' + d.tags.join('、'));
    lines.push('', '## 夢の内容', '', String(d.body || ''));
    return lines.join('\n');
  }

  $('#export-md').addEventListener('click', function () {
    if (!dreams.length) {
      alert('まだ書き出す夢がないよ。');
      return;
    }
    var ordered = dreams.slice().sort(function (a, b) {
      return (a.date || '').localeCompare(b.date || '') || (a.created || 0) - (b.created || 0);
    });
    var contents = '# 夢のノート\n\n全' + ordered.length + '件\n\n---\n\n' +
      ordered.map(markdownText).join('\n\n---\n\n');
    var blob = new Blob(['\uFEFF', contents, '\n'], { type: 'text/markdown;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = 'dream-note-' + todayStr() + '.md';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  });

  $('#search').addEventListener('input', render);

  function closeEditor(id) {
    delete editors[id];
    render();
    var btn = $('#list .edit[data-id="' + CSS.escape(id) + '"]');
    if (btn) btn.focus();
  }

  // 書き直した夢を手元に保存して、保管庫へ送る
  $('#list').addEventListener('submit', function (e) {
    var form = e.target;
    if (!form.classList.contains('edit-form')) return;
    e.preventDefault();
    var box = form.querySelector('.error');
    clearError(box);
    var f = form.elements;
    var id = form.closest('li').getAttribute('data-id');
    var date = f.date.value;
    var body = f.body.value.trim();
    if (!date) {
      showError('見た日を入れてね。', box);
      f.date.focus();
      return;
    }
    if (!body) {
      showError('夢の内容を少しだけでも書いてみてね。', box);
      f.body.focus();
      return;
    }
    var i = find(id);
    if (i === -1) { closeEditor(id); return; }
    var before = dreams[i];
    dreams[i] = Object.assign({}, before, {
      date: date,
      title: f.title.value.trim(),
      body: body,
      people: f.people.value.trim(),
      tags: checkedTags(form),
      updated: Date.now()
    });
    if (!save()) {
      dreams[i] = before;
      showError('保存できませんでした。もう一度試してみてね。', box);
      return;
    }
    closeEditor(id);
    sync();
  });

  $('#list').addEventListener('click', function (e) {
    var edit = e.target.closest('.edit');
    if (edit) {
      var id = edit.getAttribute('data-id');
      var i = find(id);
      if (i === -1) return;
      var li = buildEditor(dreams[i]);
      editors[id] = li;
      edit.closest('li').replaceWith(li);
      li.querySelector('textarea').focus();
      return;
    }
    var cancel = e.target.closest('[data-act="cancel"]');
    if (cancel) {
      closeEditor(cancel.closest('li').getAttribute('data-id'));
      return;
    }
    var btn = e.target.closest('.del');
    if (!btn) return;
    if (btn.hasAttribute('data-armed')) {
      var id = btn.getAttribute('data-id');
      dreams = dreams.filter(function (d) { return d.id !== id; });
      if (pendingDel.indexOf(id) === -1) pendingDel.push(id);
      save();
      render();
      sync();
      return;
    }
    btn.setAttribute('data-armed', '');
    btn.textContent = 'やっぱり消す';
    setTimeout(function () {
      if (btn.isConnected) {
        btn.removeAttribute('data-armed');
        btn.textContent = '消す';
      }
    }, 3500);
  });

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function buildEntry(d) {
    var li = el('li', 'entry');
    var head = el('div', 'entry-head');
    head.appendChild(el('p', 'date', fmtDate(d.date)));
    if (d.title) head.appendChild(el('h3', 'title', d.title));
    li.appendChild(head);

    li.appendChild(el('p', 'body', d.body));

    if (d.people) {
      var p = el('p', 'people', '出てきた人：' + d.people);
      li.appendChild(p);
    }

    var tags = d.tags || [];
    if (tags.length) {
      var pills = el('div', 'pills');
      tags.forEach(function (t) { pills.appendChild(el('span', 'pill', t)); });
      li.appendChild(pills);
    }

    var foot = el('div', 'entry-foot');
    var edit = el('button', 'edit', '直す');
    edit.type = 'button';
    edit.setAttribute('data-id', d.id);
    foot.appendChild(edit);
    var del = el('button', 'del', '消す');
    del.type = 'button';
    del.setAttribute('data-id', d.id);
    foot.appendChild(del);
    li.appendChild(foot);
    return li;
  }

  function buildEditor(d) {
    var li = el('li', 'entry editing');
    li.setAttribute('data-id', d.id);
    var form = $('#edit-tpl').content.firstElementChild.cloneNode(true);
    var tags = $('#form .tags').cloneNode(true);
    tags.querySelectorAll('input').forEach(function (i) {
      i.checked = (d.tags || []).indexOf(i.value) !== -1;
    });
    form.insertBefore(tags, form.querySelector('.error'));
    var f = form.elements;
    f.date.value = d.date;
    f.title.value = d.title || '';
    f.body.value = d.body;
    f.people.value = d.people || '';
    li.appendChild(form);
    return li;
  }

  function render() {
    var q = $('#search').value.trim().toLowerCase();
    // 書き直している途中に別の端末で消された夢は、欄を閉じる
    Object.keys(editors).forEach(function (id) {
      if (find(id) === -1) delete editors[id];
    });
    var list = dreams
      .filter(function (d) {
        if (!q || editors[d.id]) return true;
        var hay = [d.title, d.body, d.people, (d.tags || []).join(' ')].join(' ').toLowerCase();
        return hay.indexOf(q) !== -1;
      })
      .sort(function (a, b) {
        return b.date.localeCompare(a.date) || (b.created - a.created);
      });

    // 書き直している途中の欄は動かさずに残し、そのまわりだけ作り直す
    // （作り直すと、同期のたびに打ちかけの文字やスマホのキーボードが消えてしまうので）
    var ul = $('#list');
    // 「直す」「消す」にカーソルがあったら、作り直したあとも同じボタンに戻す
    var was = document.activeElement;
    var back = was && was.matches('#list .entry-foot button')
      ? '.' + was.className + '[data-id="' + CSS.escape(was.getAttribute('data-id')) + '"]'
      : null;
    Array.prototype.slice.call(ul.children).forEach(function (n) {
      if (editors[n.getAttribute('data-id')] !== n) ul.removeChild(n);
    });
    var at = ul.firstChild;
    list.forEach(function (d) {
      var kept = editors[d.id];
      if (kept) { at = kept.nextSibling; return; }
      ul.insertBefore(buildEntry(d), at);
    });
    if (back) {
      var btn = ul.querySelector(back);
      if (btn) btn.focus({ preventScroll: true });
    }

    $('#count').textContent = q
      ? '（' + list.length + ' / ' + dreams.length + '件）'
      : (dreams.length ? '（' + dreams.length + '件）' : '');

    var empty = $('#empty');
    if (dreams.length === 0) {
      empty.textContent = 'まだ夢は書かれていません。目が覚めて、いちばん残っている場面から書いてみてね。';
      empty.hidden = false;
    } else if (list.length === 0) {
      empty.textContent = '見つからなかったよ。別の言葉で探してみて。';
      empty.hidden = false;
    } else {
      empty.hidden = true;
    }
  }

  $('#sync-form').addEventListener('submit', function (e) {
    e.preventDefault();
    syncKey = $('#sync-key').value.trim();
    try {
      if (syncKey) localStorage.setItem(SYNC_KEY, syncKey);
      else localStorage.removeItem(SYNC_KEY);
    } catch (err) {}
    $('#sync-key').value = '';
    $('#sync-box').open = false;
    sync();
  });

  // スマホでアプリを切り替えて戻ってきたときや、電波が戻ったときにも同期する
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') sync();
  });
  window.addEventListener('online', sync);

  $('#f-date').value = todayStr();
  render();
  sync();
})();
</script>

</body></html>
